<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sanook.com YouTube — 2026 Executive Year in Review (EN / TH / 中文)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg-base: #070B14;
      --bg-surface: #0E1525;
      --bg-elevated: #141E33;
      --bg-hover: #1A2742;
      --border: rgba(148, 163, 184, 0.14);
      --border-strong: rgba(148, 163, 184, 0.28);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --accent-red: #F43F5E;
      --accent-cyan: #38BDF8;
      --accent-emerald: #10B981;
      --accent-amber: #F59E0B;
      --accent-violet: #A855F7;
      --accent-blue: #6366F1;
      --radius-sm: 10px;
      --radius-md: 16px;
      --shadow-card: 0 12px 32px rgba(0, 0, 0, 0.35);
      --font-body: 'Inter', 'Noto Sans Thai', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-head: 'Space Grotesk', 'Noto Sans Thai', 'Noto Sans SC', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .tabular { font-variant-numeric: tabular-nums; }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 12% 10%, rgba(244, 63, 94, 0.08), transparent 36%),
        radial-gradient(circle at 88% 18%, rgba(56, 189, 248, 0.08), transparent 38%),
        radial-gradient(circle at 50% 95%, rgba(168, 85, 247, 0.06), transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: rgba(11, 17, 30, 0.94);
      backdrop-filter: blur(18px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 40;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sidebar.collapsed { transform: translateX(-100%); }

    .brand-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-red);
      margin-bottom: 6px;
    }

    .brand-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent-red);
      box-shadow: 0 0 12px var(--accent-red);
    }

    .brand-title {
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 11px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
      transition: all 0.16s ease;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.16), rgba(56, 189, 248, 0.08));
      border-color: rgba(244, 63, 94, 0.36);
      color: var(--text-primary);
      font-weight: 600;
    }

    .nav-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      width: 24px; height: 24px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(148, 163, 184, 0.1);
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .nav-item.active .nav-num {
      background: var(--accent-red);
      color: #fff;
    }

    .sidebar-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.55;
    }

    /* Main Stage */
    .main-stage {
      flex: 1;
      margin-left: 280px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: margin-left 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .main-stage.expanded { margin-left: 0; }

    /* Topbar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(7, 11, 20, 0.86);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 11px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7.5px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }

    .btn-primary {
      background: linear-gradient(135deg, #F43F5E, #E11D48);
      border-color: transparent;
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.1); background: linear-gradient(135deg, #F43F5E, #E11D48); }

    .btn-cyan {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.32);
      color: var(--accent-cyan);
    }
    .btn-cyan:hover { background: rgba(56, 189, 248, 0.2); }

    /* Language Selector Pill (Top-Right Corner) */
    .lang-switcher {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      margin-left: 4px;
    }

    .lang-btn {
      padding: 5.5px 11px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.16s ease;
      letter-spacing: 0.02em;
    }

    .lang-btn:hover { color: var(--text-primary); }

    .lang-btn.active {
      background: linear-gradient(135deg, #F43F5E, #E11D48);
      color: #fff;
      box-shadow: 0 2px 10px rgba(244, 63, 94, 0.35);
    }

    .slide-counter {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
    }

    .progress-bar-wrap { height: 3px; background: rgba(148, 163, 184, 0.1); width: 100%; }
    .progress-bar-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, var(--accent-red), var(--accent-cyan));
      transition: width 0.3s ease;
    }

    /* Slide Viewport */
    .slides-wrapper {
      flex: 1;
      padding: 28px 34px 92px;
      max-width: 1380px;
      width: 100%;
      margin: 0 auto;
    }

    .slide-animate {
      animation: fadeSlideIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-header { margin-bottom: 22px; }

    .slide-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.25);
      margin-bottom: 10px;
    }
    .slide-kicker.red { background: rgba(244, 63, 94, 0.12); color: var(--accent-red); border-color: rgba(244, 63, 94, 0.28); }
    .slide-kicker.violet { background: rgba(168, 85, 247, 0.12); color: var(--accent-violet); border-color: rgba(168, 85, 247, 0.28); }
    .slide-kicker.emerald { background: rgba(16, 185, 129, 0.12); color: var(--accent-emerald); border-color: rgba(16, 185, 129, 0.28); }

    .slide-title {
      font-family: var(--font-head);
      font-size: clamp(23px, 2.8vw, 33px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.22;
      color: var(--text-primary);
    }

    .slide-subtitle {
      font-size: 14.5px;
      color: var(--text-secondary);
      margin-top: 8px;
      max-width: 940px;
      line-height: 1.6;
    }

    /* Grids */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 15px; margin-bottom: 18px; }
    .kpi-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; margin-bottom: 18px; }
    .kpi-grid-5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 13px; margin-bottom: 18px; }
    .two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-bottom: 18px; }
    .two-col-weighted { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; margin-bottom: 18px; }
    .sub-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

    /* Cards */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-card);
    }

    .kpi-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(160deg, rgba(20, 30, 51, 0.92), rgba(14, 21, 37, 0.98));
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 17px 19px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .kpi-card:hover { transform: translateY(-2px); border-color: var(--border-strong); }
    .kpi-card::after {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--accent-cyan); opacity: 0.88;
    }
    .kpi-card.accent-red::after { background: var(--accent-red); }
    .kpi-card.accent-emerald::after { background: var(--accent-emerald); }
    .kpi-card.accent-amber::after { background: var(--accent-amber); }
    .kpi-card.accent-violet::after { background: var(--accent-violet); }

    .kpi-label {
      font-size: 11.5px; font-weight: 600; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 9px;
    }

    .kpi-value {
      font-family: var(--font-head);
      font-size: clamp(21px, 2.2vw, 29px);
      font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); line-height: 1.15;
    }

    .kpi-delta {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 9px;
      font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
      background: rgba(16, 185, 129, 0.14); color: #34D399;
    }
    .kpi-delta.warn { background: rgba(245, 158, 11, 0.14); color: #FBBF24; }
    .kpi-delta.info { background: rgba(56, 189, 248, 0.14); color: #7DD3FC; }
    .kpi-delta.violet { background: rgba(168, 85, 247, 0.16); color: #D8B4FE; }

    .kpi-note { font-size: 12px; color: var(--text-muted); margin-top: 7px; line-height: 1.45; }

    .card-title {
      font-family: var(--font-head);
      font-size: 15.5px; font-weight: 700; color: var(--text-primary);
      margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }

    .card-sub { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 14px; line-height: 1.5; }

    .callout {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.09), rgba(99, 102, 241, 0.07));
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: var(--radius-md);
      padding: 15px 19px; margin-bottom: 18px; font-size: 13.5px; line-height: 1.65; color: var(--text-primary);
    }
    .callout.red { background: linear-gradient(135deg, rgba(244, 63, 94, 0.11), rgba(245, 158, 11, 0.06)); border-color: rgba(244, 63, 94, 0.3); }
    .callout.emerald { background: linear-gradient(135deg, rgba(16, 185, 129, 0.11), rgba(56, 189, 248, 0.06)); border-color: rgba(16, 185, 129, 0.3); }

    .mix-bar { height: 14px; border-radius: 999px; overflow: hidden; display: flex; background: var(--bg-elevated); margin: 12px 0 14px; }
    .mix-seg { height: 100%; }
    .legend-row { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--text-secondary); line-height: 1.45; }
    .legend-item { display: inline-flex; align-items: center; gap: 7px; }
    .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }

    .chart-box { position: relative; height: 265px; width: 100%; }
    .chart-box.compact { height: 225px; }

    /* Expandable Deep-Dive Modules */
    .expand-stack { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
    .expand-card {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md);
      overflow: hidden; transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .expand-card.open { border-color: rgba(56, 189, 248, 0.42); box-shadow: 0 14px 36px rgba(0, 0, 0, 0.42); }

    .expand-trigger {
      width: 100%;
      background: linear-gradient(90deg, rgba(20, 30, 51, 0.65), rgba(14, 21, 37, 0.9));
      border: none; padding: 15px 19px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      cursor: pointer; color: var(--text-primary); text-align: left; font-family: inherit;
      transition: background 0.18s ease;
    }
    .expand-trigger:hover { background: rgba(26, 39, 66, 0.85); }

    .expand-trigger-left { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
    .expand-badge {
      font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 4px 9px; border-radius: 6px;
      background: rgba(56, 189, 248, 0.14); color: var(--accent-cyan); border: 1px solid rgba(56, 189, 248, 0.28);
    }
    .expand-badge.red { background: rgba(244, 63, 94, 0.14); color: #FDA4AF; border-color: rgba(244, 63, 94, 0.3); }
    .expand-badge.emerald { background: rgba(16, 185, 129, 0.14); color: #6EE7B7; border-color: rgba(16, 185, 129, 0.3); }
    .expand-badge.violet { background: rgba(168, 85, 247, 0.14); color: #D8B4FE; border-color: rgba(168, 85, 247, 0.3); }
    .expand-badge.amber { background: rgba(245, 158, 11, 0.14); color: #FCD34D; border-color: rgba(245, 158, 11, 0.3); }

    .expand-title { font-family: var(--font-head); font-size: 14.5px; font-weight: 700; color: var(--text-primary); }
    .expand-hint { font-size: 12px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .chevron {
      width: 26px; height: 26px; border-radius: 50%; background: rgba(148, 163, 184, 0.12);
      display: inline-flex; align-items: center; justify-content: center; font-size: 13px; color: var(--text-primary);
      transition: transform 0.25s ease, background 0.2s ease;
    }
    .expand-card.open .chevron { transform: rotate(180deg); background: var(--accent-cyan); color: #070B14; }

    .expand-body {
      display: none; padding: 19px 21px 21px;
      border-top: 1px solid var(--border); background: rgba(9, 14, 25, 0.68);
    }
    .expand-card.open .expand-body { display: block; animation: fadeSlideIn 0.22s ease; }

    /* Tables */
    .table-wrap { width: 100%; overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    thead { background: rgba(20, 30, 51, 0.96); }
    th {
      padding: 10px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--text-secondary); border-bottom: 1px solid var(--border-strong); white-space: nowrap;
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text-primary); vertical-align: top; line-height: 1.5; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(56, 189, 248, 0.04); }
    .row-highlight { background: rgba(244, 63, 94, 0.08) !important; font-weight: 600; }
    .row-total { background: rgba(56, 189, 248, 0.09) !important; font-weight: 700; }

    .pill { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .pill-green { background: rgba(16, 185, 129, 0.16); color: #34D399; }
    .pill-red { background: rgba(244, 63, 94, 0.16); color: #FDA4AF; }
    .pill-amber { background: rgba(245, 158, 11, 0.16); color: #FCD34D; }
    .pill-cyan { background: rgba(56, 189, 248, 0.16); color: #7DD3FC; }
    .pill-violet { background: rgba(168, 85, 247, 0.16); color: #D8B4FE; }

    .detail-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .detail-list li { position: relative; padding-left: 17px; font-size: 13.5px; line-height: 1.6; color: var(--text-secondary); }
    .detail-list li::before {
      content: ""; position: absolute; left: 0; top: 9px; width: 7px; height: 7px;
      border-radius: 50%; background: var(--accent-cyan);
    }
    .detail-list.red li::before { background: var(--accent-red); }
    .detail-list.emerald li::before { background: var(--accent-emerald); }
    .detail-list.amber li::before { background: var(--accent-amber); }
    .detail-list.violet li::before { background: var(--accent-violet); }
    .detail-list strong { color: var(--text-primary); }

    .mini-panel {
      background: rgba(14, 21, 37, 0.9); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 15px;
    }
    .mini-panel h4 { font-family: var(--font-head); font-size: 14px; margin-bottom: 9px; color: var(--text-primary); }
    .section-divider {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); margin: 16px 0 9px;
    }
    .footnote { font-size: 12px; color: var(--text-muted); margin-top: 11px; line-height: 1.55; }

    /* Speaker Notes Drawer */
    .notes-drawer {
      position: fixed; right: 24px; bottom: 24px; width: min(460px, calc(100vw - 32px)); max-height: 62vh;
      background: rgba(14, 21, 37, 0.97); backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.38); border-radius: var(--radius-md);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65); z-index: 60; display: none; flex-direction: column; overflow: hidden;
    }
    .notes-drawer.open { display: flex; }
    .notes-header {
      padding: 13px 17px; background: rgba(20, 30, 51, 0.95); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .notes-header span { font-family: var(--font-head); font-size: 13.5px; font-weight: 700; color: var(--accent-cyan); }
    .notes-body { padding: 16px 18px; overflow-y: auto; font-size: 13.5px; line-height: 1.7; color: var(--text-secondary); white-space: pre-line; }

    /* Bottom Floating Nav */
    .bottom-nav {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 35;
      background: rgba(14, 21, 37, 0.94); backdrop-filter: blur(16px);
      border: 1px solid var(--border-strong); border-radius: 999px; padding: 6px 10px;
      display: flex; align-items: center; gap: 8px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    .dot-nav { display: flex; align-items: center; gap: 6px; padding: 0 6px; }
    .slide-dot { width: 8px; height: 8px; border-radius: 999px; background: rgba(148, 163, 184, 0.3); border: none; cursor: pointer; transition: all 0.2s ease; }
    .slide-dot.active { width: 24px; background: var(--accent-red); }

    @media (max-width: 1120px) {
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  // Speaker Notes in 3 Languages
  function getSpeakerNote(idx) {
    const notes = [
      L(
        `SLIDE 01 — FULL 2026 REVENUE REPORT\n\nSanook.com closed Jan 1 – Nov 24, 2026 with $16,734.53 in finalized YouTube revenue—an 18.2x (+1,716.5%) expansion over 2025.\n\nCrucially, this wasn't just a view-volume story (+323%). Watch Time surged +2,227% to 2.07M hours, multiplying mid-roll ad impressions and lifting Channel RPM 4.5x from $0.24 to $1.07.\n\nRevenue is balanced across Watch Page Ads (54.87%) and YouTube Premium (44.93%), with flagship Nintha Khao generating 94.50% ($15,813.72). Expand the 2027 levers panel to review five concrete ways to lift earnings further.`,
        `สไลด์ 01 — รายงานรายได้ประจำปี 2026 ฉบับเต็ม\n\nช่อง Sanook.com ปิดรายได้ตั้งแต่วันที่ 1 ม.ค. – 24 พ.ย. 2026 ที่ $16,734.53 หรือเติบโตถึง 18.2 เท่า (+1,716.5%) เมื่อเทียบกับปี 2025\n\nจุดสำคัญคือรายได้ไม่ได้โตเพราะยอดวิว (+323%) เพียงอย่างเดียว แต่เกิดจาก Watch Time ที่พุ่งขึ้น +2,227% ทะลุ 2.07 ล้านชั่วโมง ซึ่งช่วยเพิ่มโฆษณาคั่นกลาง (Mid-roll) และดัน RPM จาก $0.24 ขึ้นมาที่ $1.07 (4.5 เท่า)\n\nโครงสร้างรายได้สมดุลมากระหว่างโฆษณาหน้าวิดีโอ (54.87%) และ YouTube Premium (44.93%) โดยมีรายการเรือธง "นินทาข่าว" ทำรายได้คิดเป็น 94.50% ($15,813.72) สามารถกางดู 5 แนวทางเพิ่มรายได้ปี 2027 ด้านล่างได้เลยครับ`,
        `第01页 — 2026年全年收入报告\n\n2026年1月1日至11月24日，Sanook.com YouTube频道实现预估总收入16,734.53美元，较2025年暴增18.2倍（+1,716.5%）。\n\n核心驱动力不仅是播放量增长（+323%），更在于观看时长激增+2,227%至207万小时，显著增加中插广告曝光，带动频道RPM从0.24美元跃升至1.07美元（4.5倍）。\n\n收入结构极为健康：观看页广告占54.87%，YouTube Premium会员分成占44.93%；旗舰栏目《八卦新闻》贡献了94.50%（15,813.72美元）的频道收入。展开下方模块可查看2027年五大增收抓手。`
      ),
      L(
        `SLIDE 02 — EXECUTIVE SUMMARY & YOY TURNAROUND\n\nIf there is one primary takeaway from 2026, it is that our pivot toward high-retention, long-form news commentary fundamentally transformed Sanook.com's commercial foundation.\n\nIn 2025, our channel averaged just 1m 23s per view, under 89K watch hours, and less than $1,000 all year. In 2026, views grew 323% to surpass 23.1M, watch time jumped 23x to over 2M hours, and AVD climbed to 5:22 (5:42 on long-form).\n\nThis wasn't accidental viral luck: packaging discipline lifted CTR +1.51 pts to 5.74% across 176M impressions, welcoming nearly 44,000 net new subscribers.`,
        `สไลด์ 02 — สรุปผู้บริหารและการพลิกฟื้นแบบก้าวกระโดด (YoY)\n\nบทสรุปที่ชัดที่สุดของปี 2026 คือการปรับยุทธศาสตร์มาเน้นคอนเทนต์ข่าววิเคราะห์แบบ Long-form ได้เปลี่ยนฐานรายได้และผู้ชมของ Sanook.com ไปโดยสิ้นเชิง\n\nในปี 2025 ช่องเรามียอดดูเฉลี่ยต่อครั้งแค่ 1 นาที 23 วินาที, Watch Time ไม่ถึง 89,000 ชั่วโมง และรายได้ทั้งปีไม่ถึง 1,000 ดอลลาร์ แต่ในปี 2026 ยอดวิวโต 323% ทะลุ 23.1 ล้านครั้ง, Watch Time พุ่ง 23 เท่าเกิน 2 ล้านชั่วโมง และ AVD ขึ้นมาที่ 5:22 นาที (Long-form 5:42 นาที)\n\nทั้งหมดไม่ใช่ไวรัลฟลุก แต่วินัยการทำปกและพาดหัวช่วยดัน CTR ขึ้น +1.51% เป็น 5.74% จาก 176 ล้าน Impressions พร้อมผู้ติดตามใหม่เกือบ 44,000 คน`,
        `第02页 — 执行摘要与2026年度反转\n\n2026年最核心的结论是：转向高留存长视频新闻评论，从根本上重塑了Sanook.com的商业与受众基础。\n\n2025年，频道平均观看时长仅1分23秒，总时长不足8.9万小时，全年收入不足1,000美元；而2026年总播放量增长323%突破2,310万，观看时长飙升23.3倍超206万小时，平均观看时长跃升至5分22秒（长视频5分42秒）。\n\n这并非偶然爆款：封面与标题体系的优化使CTR在1.76亿次曝光下提升1.51个百分点至5.74%，净增订阅近4.4万人。`
      ),
      L(
        `SLIDE 03 — REVENUE TRAJECTORY & INFLECTION POINT\n\nThis chart tells the financial story of 2026: a sharp structural inflection followed by sustained compounding.\n\nFrom Jan to Apr, revenue averaged ~$57/month at $0.12–$0.49 RPM. In May, consistent long-form news episodes exploded watch time 41x—from 2.2K hours in April to 93.4K hours—lifting monthly revenue +1,357% to nearly $1,000.\n\nRPM rose steadily every quarter from $0.78 in May to $1.39 in October, where monthly revenue peaked at $4,829.13—a 70x increase over April.`,
        `สไลด์ 03 — เส้นทางรายได้และจุดเปลี่ยนสำคัญ (May Inflection)\n\nกราฟนี้เล่าเรื่องการเงินของปี 2026 ได้ชัดเจนที่สุด นั่นคือจุดเปลี่ยนเชิงโครงสร้างในเดือนพฤษภาคม ตามด้วยการเติบโตแบบทบต้นต่อเนื่อง\n\nช่วง ม.ค.–เม.ย. รายได้เฉลี่ยเพียงเดือนละ ~$57 (RPM $0.12–$0.49) พอเข้าเดือนพฤษภาคมที่เริ่มลงรายการนินทาข่าวแบบยาวอย่างสม่ำเสมอ Watch Time พุ่งขึ้น 41 เท่า จาก 2.2 พันชั่วโมงเป็น 93.4 พันชั่วโมง ดันรายได้กระโดด +1,357% เกือบแตะ $1,000 ในเดือนเดียว\n\nหลังจากนั้น RPM ไต่ระดับทุกไตรมาสจาก $0.78 ไปพีคสุดที่ $1.39 ในเดือนตุลาคม ทำรายได้สูงสุดเป็นประวัติการณ์ที่ $4,829.13 หรือสูงกว่าเดือนเมษายนถึง 70 เท่า`,
        `第03页 — 月度收入轨迹与5月增长拐点\n\n这张图表完整呈现了2026年的商业转折：从低基数实现结构性突破，并持续复利增长。\n\n1至4月，频道月均收入仅约57美元（RPM 0.12–0.49美元）。5月推出规律化的长视频旗舰栏目后，单月观看时长暴增41倍（从2,237小时增至93,410小时），单月收入环比暴涨+1,357%至近1,000美元。\n\n此后每季度RPM稳步攀升：5月0.78美元 → 8月0.99美元 → 10月创历史新高1.39美元，10月单月收入达4,829.13美元，较4月增长70倍。`
      ),
      L(
        `SLIDE 04 — CONTENT FORMAT CONTRIBUTION\n\nThe format verdict is unequivocal: Long-form video drives virtually all business value on the channel.\n\nLong-form delivered 93.76% of views, 99.51% of watch time (2.06M hours), 99.80% of revenue ($16,701.67), and 96.17% of net subscribers. Every 1,000 long-form views returned $1.14 vs. just $0.03 on Shorts.\n\nShorts ($32.86 total) should never be judged on direct earnings—their strict role is cutting tense 30-second trailers to funnel casual viewers into full episodes. Live streams (<1,000 views) remain an untapped 2027 pillar.`,
        `สไลด์ 04 — สัดส่วนผลงานแยกตามฟอร์แมต\n\nตัวเลขฟันธงชัดเจนว่า Long-form คือเครื่องจักรหลักที่สร้างมูลค่าแทบทั้งหมดให้ช่อง\n\nวิดีโอยาวทำสัดส่วน 93.76% ของยอดวิว, 99.51% ของ Watch Time (2.06 ล้านชั่วโมง), 99.80% ของรายได้ ($16,701.67) และ 96.17% ของผู้ติดตามใหม่ ทุกๆ 1,000 วิวของ Long-form ทำเงิน $1.14 เทียบกับ Shorts เพียง $0.03 (ต่างกัน 38 เท่า)\n\nดังนั้น Shorts ไม่ควรถูกวัดผลด้วยรายได้โดยตรง แต่ต้องใช้เป็น "ตัวอย่าง 30 วินาที" เพื่อดึงคนเข้าดูคลิปเต็ม ส่วน Live Stream (<1,000 วิว) ยังเป็นพื้นที่ว่างที่น่านำร่องในปี 2027`,
        `第04页 — 内容形态贡献分析\n\n数据结论非常明确：长视频贡献了频道几乎全部的商业与用户价值。\n\n长视频占比达93.76%播放量、99.51%观看时长（206万小时）、99.80%收入（16,701.67美元）以及96.17%净增订阅。每千次长视频播放收益1.14美元，而Shorts仅为0.03美元（相差38倍）。\n\n因此Shorts不应作为直接变现工具，而应严格定位为“30秒高能预告片”引流至正片；直播（全年不足1,000次观看）则是2027年极具潜力的增量蓝海。`
      ),
      L(
        `SLIDE 05 — CONTENT STRATEGY AUDIT\n\nNintha Khao thrived as the evening post-show companion to major live TV controversies (Hone Krasae). High-stakes conflict, leaked audio, and personal betrayal pushed CTR to 6.6%–7.3% and held viewers for 11–15 minutes.\n\nBy contrast, SEERCRET PODCAST (10,316 views, 3.12% CTR) suffered from audience intent mismatch on the Browse feed, while Nintha Series actually earned solid click appeal (209K views, 5.59% CTR) but lost ad earnings on 6 of 13 episodes due to Content ID claims.`,
        `สไลด์ 05 — วิเคราะห์กลยุทธ์คอนเทนต์: อะไรเวิร์ก vs อะไรต้องปรับ\n\nสูตรสำเร็จของ "นินทาข่าว" คือการเป็นเพื่อนคุยหลังรายการสดดังอย่างโหนกระแส เมื่อประเด็นมีความขัดแย้งสูง มีคลิปเสียงหลุด หรือดราม่าครอบครัว CTR จะพุ่งแตะ 6.6%–7.3% และคนดูอยู่ยาวถึง 11–15 นาที\n\nในทางกลับกัน SEERCRET PODCAST (10,316 วิว, CTR 3.12%) เจอปัญหา Intent Mismatch กับผู้ชมสายข่าว ส่วน "นินทาซีรีส์" ทำยอดวิวและ CTR ได้ดี (209K วิว, CTR 5.59%) แต่ 6 จาก 13 ตอนโดน Content ID จากภาพละครตัดรายได้เป็น $0.00`,
        `第05页 — 内容策略复盘：成败解析\n\n《八卦新闻》的成功公式在于成为热门日间直播节目的“晚间深度伴随复盘”。当话题涉及高冲突矛盾、曝光录音或情感纠纷时，点击率可达6.6%–7.3%，平均观看时长高达11–15分钟。\n\n反观实验栏目：SEERCRET PODCAST（10,316次播放，CTR 3.12%）因与主频道新闻受众诉求不匹配而遇冷；《八卦剧集》（20.9万播放，CTR 5.59%）点击表现良好，但13期中有6期因使用电视剧原片触发Content ID版权索赔导致收益归零。`
      ),
      L(
        `SLIDE 06 — AUDIENCE DISCOVERY & TRAFFIC SOURCES\n\nOver 75% of views and 89.6% of watch hours originated from Browse Features and Suggested Videos combined.\n\nBrowse Features delivered 10.7M views across 74.6M impressions at a strong 7.05% CTR, proving our thumbnails cut through Home screen competition. Meanwhile, Suggested Videos is our #1 watch-time engine—965K hours (46.7% share) at an 8:39 average view duration.\n\nSearch added 3.6M high-intent views, while Channel Pages and Playlists drove the longest sessions on the channel (9:26–9:43 AVD).`,
        `สไลด์ 06 — แหล่งทราฟฟิกและระบบการค้นพบช่อง\n\nโครงสร้างการเติบโตของช่องแข็งแรงมาก เพราะกว่า 75% ของยอดวิว และ 89.6% ของชั่วโมงรับชม มาจากระบบแนะนำของ YouTube (Browse + Suggested)\n\nBrowse Features ทำยอดวิวสูงสุด 10.7 ล้านครั้ง พร้อม CTR สูงถึง 7.05% พิสูจน์ว่าปกและพาดหัวชนะหน้าฟีด ขณะที่ Suggested Videos คือเครื่องจักรสร้าง Watch Time อันดับ 1 (965K ชั่วโมง หรือ 46.7% ของทั้งช่อง) ด้วย AVD เฉลี่ย 8 นาที 39 วินาที\n\nนอกจากนี้ YouTube Search ช่วยดึงคนค้นหาชื่อประเด็นร้อนได้อีก 3.6 ล้านวิว และกลุ่มแฟนพันธุ์แท้จากหน้าช่อง/เพลย์ลิสต์ดูยาวเกือบ 10 นาทีต่อครั้ง`,
        `第06页 — 受众发现与流量来源结构\n\nSanook.com拥有非常健康的推荐流生态：超过75%的播放量和89.6%的观看时长来自首页推荐（Browse）与相关推荐（Suggested）。\n\n首页推荐在7,460万次曝光中拿下1,069万次播放，CTR高达7.05%，充分验证了封面与标题的吸睛能力；相关推荐则是观看时长第一引擎，贡献96.5万小时（占全频道46.7%），平均观看时长达8分39秒。\n\n搜索贡献了360万次热点意图流量，而频道主页与播放列表的忠实粉丝单次观看更是超过9分半钟。`
      ),
      L(
        `SLIDE 07 — AUDIENCE DEMOGRAPHICS & VIEWING HABITS\n\nFor brand partners and senior executives, this is our strongest commercial story.\n\n62.8% of viewers sit squarely in the prime 25–44 working-adult bracket with purchasing power, evenly split at 52% female and 48% male.\n\nWhile mobile leads views (69%), Tablets (13:30 AVD) and Connected TVs (8:39 AVD) account for nearly a quarter (24.5%) of watch time—proving audiences treat our shows like evening television between 6:00 PM and 10:00 PM GMT+7. Plus, 1.7M+ overseas views from the US, Australia, Japan, and Europe boost international CPMs.`,
        `สไลด์ 07 — โครงสร้างผู้ชมและพฤติกรรมการรับชม\n\nหน้านี้คือจุดขายเชิงพาณิชย์ที่แข็งแรงที่สุดสำหรับเสนอขายสปอนเซอร์และแบรนด์\n\n62.8% ของผู้ชมอยู่ในวัยทำงานตอนต้นถึงผู้ใหญ่ตอนกลาง (25–44 ปี) ซึ่งเป็นกลุ่มมีกำลังซื้อสูง และสัดส่วนเพศสมดุลเกือบ 50/50 (หญิง 52.2% / ชาย 47.7%) เหมาะกับสินค้า Mass หลากหลายหมวด\n\nแม้ 69% จะดูผ่านมือถือ แต่แท็บเล็ต (AVD 13:30 นาที) และสมาร์ททีวี (AVD 8:39 นาที) รวมกันสร้าง Watch Time เกือบ 1 ใน 4 ของช่อง (24.5%) สะท้อนว่าคนดูเปิดฟังช่วงไพรม์ไทม์ 18:00–22:00 น. เหมือนดูรายการทีวี พร้อมฐานคนไทยในสหรัฐฯ ออสเตรเลีย ญี่ปุ่น และยุโรปกว่า 1.7 ล้านวิวที่ช่วยดึง CPM ให้สูงขึ้น`,
        `第07页 — 受众画像与观看习惯\n\n这是最具商业招商说服力的核心页面。\n\n全频道62.8%的观众集中在25–44岁高消费力职场主力人群，且男女比例高度均衡（女性52.2% / 男性47.7%），非常契合快消、汽车、金融与电商等主流品牌投放。\n\n虽然移动端占69%播放量，但平板（平均观看13分30秒）和智能电视（8分39秒）合计贡献近四分之一（24.5%）观看时长，说明观众在曼谷时间晚6点至10点将我们的节目当作“晚间电视”收看；同时美、澳、日、欧等超170万海外泰裔流量显著抬升了整体CPM。`
      ),
      L(
        `SLIDE 08 — DEEP-DIVE: NINTHA KHAO\n\nNintha Khao powered Sanook.com's entire 2026 turnaround: 148 Monday–Friday episodes generated 20.39M views, 94.70% of watch hours (1.96M hrs), and 94.50% of revenue ($15,813.72).\n\nOur Top 5 most-viewed episodes delivered 2.67M views and $1,812, with standout sessions hitting 11 to 15+ minutes on stories like Auntie Maew's Son and Yat vs. Ta.\n\nOur core moat is operational routine: an unbroken Mon–Fri schedule paired with conversational storytelling and high-contrast visual packaging.`,
        `สไลด์ 08 — เจาะลึกรายการเรือธง "นินทาข่าว"\n\nรายการนี้คือหัวใจของการพลิกโฉมช่องในปี 2026 ตลอด 148 ตอน (จันทร์–ศุกร์) ทำยอดวิว 20.39 ล้านครั้ง, Watch Time 1.96 ล้านชั่วโมง (94.70%) และรายได้ $15,813.72 (94.50% ของทั้งช่อง)\n\nเฉพาะ Top 5 ตอนยอดนิยมสูงสุดทำรวมกันถึง 2.67 ล้านวิว และหลายตอนคนดูอยู่ยาวเฉลี่ยถึง 11–15 นาที เช่น ตอนลูกชายป้าแมว และ ยัต vs ต้า\n\nจุดแข็งที่คู่แข่งเลียนแบบยากคือ "วินัยการออกอากาศทุกวันจันทร์–ศุกร์" ที่สร้างนิสัยการรอรับชมหลังเลิกงาน ผสานสไตล์การเล่าข่าวแบบเพื่อนคุยที่ฟังเพลินไม่เหมือนการอ่านสคริปต์ข่าวทางการ`,
        `第08页 — 旗舰栏目深度解析：《八卦新闻》\n\n《八卦新闻》是2026年频道爆发的绝对核心：全年148期（周一至周五日更）贡献2,039万次播放、196万观看小时（占94.70%）以及15,813.72美元收入（占94.50%）。\n\n播放量前五的单期合计达267万次播放，其中多期爆款平均观看时长高达11至15分钟以上。\n\n我们最强的护城河是“周一至周五雷打不动的日更习惯”：在工作日傍晚为观众提供轻松聊天式的热点复盘，配合高对比度封面包装，形成了极高的用户粘性。`

      L(
        `SLIDE 09 — NEW PROGRAM INCUBATOR: SEERCRET & NINTHA SERIES\n\nSEERCRET PODCAST proved strong studio quality and Shorts traction (10K–15K views) with 100% clean copyright, but long-form views stopped at 10,316 (3.12% CTR) due to intent mismatch.\n\nNintha Series proved genuine click appeal—209K views and 5.59% CTR—but Content ID claims demonetized 6 of 13 episodes, capping earnings at $46.21.\n\nIn 2027, we re-anchor both: pivot SEERCRET toward spiritual fraud investigations, and shift Nintha Series to copyright-safe, standalone cultural phenomenon debriefs.`,
        `สไลด์ 09 — ประเมินรายการใหม่: SEERCRET PODCAST & นินทาซีรีส์\n\nการทดลองรายการใหม่ปลายปี 2026 ให้บทเรียนสำคัญมากครับ\n\nSEERCRET PODCAST มีงานโปรดักชันดีมาก ลิขสิทธิ์คลีน 100% และคลิปสั้นสายดูลายมือทำวิวได้ 10K–15K แต่พอลงคลิปยาวในฟีดหลัก ยอดวิวรวม 3 ตอนอยู่ที่ 10,316 (CTR 3.12%) เพราะไม่ตรงความคาดหวังของฐานผู้ชมข่าว\n\nส่วน "นินทาซีรีส์" ยอดวิวรวม 13 ตอนทะลุ 209,181 และ CTR 5.59% ใกล้เคียงค่าเฉลี่ยช่อง แต่ติดปัญหา 6 จาก 13 ตอนโดน Content ID ตัดรายได้ ทำให้ได้เงินแค่ $46.21 ปี 2027 จึงควรปรับ SEERCRET สู่โหมดเจาะลึกดราม่า/แฉกลโกงสายมู และปรับนินทาซีรีส์ให้ใช้ภาพนิ่ง/PiP ปลอดลิขสิทธิ์ พร้อมเล่าเป็นประเด็นกระแสจบในตอน`,
        `第09页 — 新栏目孵化复盘：SEERCRET 与《八卦剧集》\n\n2026年末的两档实验栏目带来了极具价值的实战洞察。\n\nSEERCRET PODCAST制作精良、100%无版权风险，且手相/民俗类Shorts表现不错（1万–1.5万播放），但长视频3期总播放仅10,316次（CTR 3.12%），核心症结在于与主频道新闻观众预期错位。\n\n《八卦剧集》13期拿下20.9万播放与5.59%的高CTR，证明具备点击吸引力，但6期因剧集原片触发Content ID收益归零，总收入仅46.21美元。2027年应将SEERCRET转向“玄学打假与争议调查”，将《八卦剧集》改为无版权风险的独立文化现象解读。`

      L(
        `SLIDE 10 — 2027 STRATEGIC PRIORITIES & CONCLUSION\n\n2026 proved the concept; 2027 is about scaling and protecting the brand.\n\n1) Fortify Nintha Khao's Mon–Fri cadence and pilot live breaking-news specials. 2) Refactor spin-offs around investigative controversy and copyright-safe cultural hooks while using Shorts strictly as conversion trailers. 3) Expand commercial tiers via native sponsorships, manual mid-roll optimization, Shopping, and Memberships.\n\nTogether, these pillars target 32–35M views, 2.8–3.2M watch hours, $1.35–$1.50 RPM, and $35,000–$45,000 in annualized platform revenue in 2027.`,
        `สไลด์ 10 — ยุทธศาสตร์ปี 2027 และบทสรุปผู้บริหาร\n\nปี 2026 คือปีที่เราพิสูจน์สูตรสำเร็จได้แล้ว ส่วนปี 2027 คือปีแห่งการขยายสเกลและกระจายแหล่งรายได้\n\nเสาหลักที่ 1: รักษาวินัย "นินทาข่าว" จันทร์–ศุกร์ พร้อมทดลอง Live ช่วงข่าวใหญ่ เสาหลักที่ 2: ปรับโฉมรายการใหม่ให้เชื่อมโยงกับดราม่า/การสืบสวน ปลอด Content ID และใช้ Shorts เป็นสะพานดึงเข้าคลิปยาว เสาหลักที่ 3: เปิดเกมขายสปอนเซอร์ตรง (Native Brand Integration) ควบคู่การวาง Mid-roll แบบ Manual, เปิด YouTube Shopping และระบบสมาชิก\n\nเป้าหมายปี 2027 คือ 32–35 ล้านวิว, 2.8–3.2 ล้านชั่วโมงรับชม, RPM $1.35–$1.50 และรายได้แพลตฟอร์ม $35,000–$45,000 ครับ`,
        `第10页 — 2027战略规划与高管总结\n\n2026年我们验证了商业模式；2027年的核心任务是规模化扩张与品牌护城河建设。\n\n支柱一：稳固《八卦新闻》周一至周五日更机制，并试点重大热点直播；支柱二：围绕“调查与争议”重构衍生栏目，彻底解决版权问题，并将Shorts严格作为正片引流预告；支柱三：发力原生品牌赞助、精细化手动中插广告、YouTube Shopping及频道会员。\n\n三大支柱协同发力，2027年剑指3,200万–3,500万播放量、280万–320万观看小时、1.35–1.50美元RPM以及35,000–45,000美元平台年收入。`
      )

  // Helper to build an expandable accordion card with preserved open/close state
  function expandCard(slideIdx, cardKey, badgeClass, badgeText, titleText, hintText, bodyHtml) {
    const stateKey = `${slideIdx}_${cardKey}`;
    const isOpen = !!openAccordions[stateKey];
    return `
      <div class="expand-card ${isOpen ? 'open' : ''}" data-key="${stateKey}">
        <button class="expand-trigger" type="button">
          <div class="expand-trigger-left">
            <span class="expand-badge ${badgeClass}">${badgeText}</span>
            <span class="expand-title">${titleText}</span>
          </div>
          <span class="expand-hint">${hintText} <span class="chevron">▾</span></span>
        </button>
        <div class="expand-body">${bodyHtml}</div>
      </div>
    `;
  }

              <div class="mini-panel"><h4>3. ${L('The Revenue Multiplier','ตัวคูณรายได้','收入乘数效应')}</h4><p style="font-size:13.5px; color:var(--text-secondary); line-height:1.6;">${L('Longer sessions lifted RPM from <strong>$0.24 to $1.07</strong>, multiplying estimated annual revenue from $921 to <strong>$16,734.53 (18.2x)</strong>.','การดูยาวดัน RPM จาก <strong>$0.24 เป็น $1.07</strong> ทำให้รายได้ทั้งปีพุ่งจาก $921 เป็น <strong>$16,734.53 (18.2 เท่า)</strong>','深度留存带动RPM从<strong>$0.24升至$1.07</strong>，年度预估收入从921美元暴增至<strong>16,734.53美元（18.2倍）</strong>。')}</p></div>

            </div>`
          )}
        </div>
      `;
    }
  }

      chartInstances[k]?.destroy();
      delete chartInstances[k];
    });
  }

  Chart.defaults.borderColor = 'rgba(148, 163, 184, 0.12)';
  Chart.defaults.font.family = "'Inter', 'Noto Sans Thai', 'Noto Sans SC', sans-serif";

          scales: {

          ],

          scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, max: 100, ticks: { callback: v => v + '%' }, grid: { color: 'rgba(148,163,184,0.08)' } } }

          ],

            { label: L('Views Share (%)','สัดส่วนยอดวิว (%)','播放占比 (%)'), data: [46.30, 29.47, 15.60, 2.43, 1.80, 4.40], backgroundColor: '#38BDF8', borderRadius: 6 },
            { label: L('Watch Time Share (%)','สัดส่วนชั่วโมงดู (%)','观看时长占比 (%)'), data: [42.89, 46.70, 3.76, 0.13, 2.90, 3.62], backgroundColor: '#F43F5E', borderRadius: 6 }

          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8 } }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y}%` } } },

    if (slideIdx === 6) {
      const ctxAge = document.getElementById('chartSlide7Age');
      const ctxDev = document.getElementById('chartSlide7Device');
      if (!ctxAge || !ctxDev) return;
      chartInstances.s7Age = new Chart(ctxAge, {
        type: 'bar',
        data: {
          labels: ['13–17','18–24','25–34','35–44','45–54','55–64','65+'],
          datasets: [
            { label: L('Female %','หญิง %','女性 %'), data: [0.29, 3.65, 18.72, 13.02, 8.36, 4.98, 3.15], backgroundColor: '#F43F5E', borderRadius: 4 },
            { label: L('Male %','ชาย %','男性 %'), data: [0.20, 2.86, 17.82, 13.27, 7.71, 3.56, 2.25], backgroundColor: '#38BDF8', borderRadius: 4 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8 } }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y}%` } } },
          scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: { callback: v => v + '%' }, grid: { color: 'rgba(148,163,184,0.08)' } } }
        }
      });
      chartInstances.s7Dev = new Chart(ctxDev, {
        type: 'bar',
        data: {

  // Render Chrome + Sidebar + Active Slide
  function renderAll(animate = true) {
    document.documentElement.lang = currentLang;

    // Update topbar & sidebar text
    document.getElementById('brandTitle').textContent = UI.brandTitle();
    document.getElementById('brandSub').textContent = UI.brandSub();
    document.getElementById('sidebarFooter').innerHTML = UI.footer();
    document.getElementById('toggleSidebarBtn').textContent = UI.slidesBtn();
    document.getElementById('toggleNotesBtn').textContent = UI.notesBtn();
    document.getElementById('fullscreenBtn').textContent = UI.fullscreenBtn();
    document.getElementById('prevBtn').textContent = UI.prevBtn();
    document.getElementById('nextBtn').textContent = UI.nextBtn();
    document.getElementById('closeNotesBtn').textContent = UI.closeBtn();

    // Language active state
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === currentLang);
    });

    // Build Sidebar Navigation
    const navList = document.getElementById('navList');
    const items = UI.navItems();
    navList.innerHTML = items.map((label, i) => `
      <button class="nav-item ${i === currentSlide ? 'active' : ''}" data-slide="${i}">
        <span class="nav-num">${String(i + 1).padStart(2, '0')}</span>
        <span>${label}</span>
      </button>
    `).join('');
    navList.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => goToSlide(Number(btn.dataset.slide)));
    });

    // Update Progress & Counter
    const numStr = String(currentSlide + 1).padStart(2, '0');
    document.getElementById('slideCounter').textContent = `${numStr} / ${TOTAL_SLIDES}`;
    document.getElementById('progressBar').style.width = `${((currentSlide + 1) / TOTAL_SLIDES) * 100}%`;

    // Update Bottom Dots
    document.querySelectorAll('.slide-dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));

    // Render Active Slide
    const stage = document.getElementById('slideStage');
    stage.innerHTML = `<section class="${animate ? 'slide-animate' : ''}">${renderSlideContent(currentSlide)}</section>`;

    // Bind Accordion Triggers
    stage.querySelectorAll('.expand-trigger').forEach(trigger => {
      trigger.addEventListener('click', () => {
        const card = trigger.closest('.expand-card');
        const key = card.dataset.key;
        const willOpen = !card.classList.contains('open');
        card.classList.toggle('open', willOpen);
        openAccordions[key] = willOpen;
        updateExpandAllButtonState();
      });
    });

    updateExpandAllButtonState();

    // Update Speaker Notes
    document.getElementById('notesTitle').textContent = `${L('🎙 Speaker Notes — Slide','🎙 สคริปต์นำเสนอ — สไลด์','🎙 演讲备注 — 第')} ${numStr}${currentLang === 'zh' ? '页' : ''}`;
    document.getElementById('notesBody').textContent = getSpeakerNote(currentSlide);

    // Render Charts
    requestAnimationFrame(() => initSlideCharts(currentSlide));
  }

  function updateExpandAllButtonState() {
    const cards = document.querySelectorAll('#slideStage .expand-card');
    const allOpen = cards.length > 0 && Array.from(cards).every(c => c.classList.contains('open'));
    document.getElementById('expandAllBtn').textContent = allOpen ? UI.collapseAll() : UI.expandAll();
  }

  function goToSlide(index) {
    if (index < 0 || index >= TOTAL_SLIDES) return;
    currentSlide = index;
    document.getElementById('sidebar').classList.remove('mobile-open');
    renderAll(true);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function setLanguage(lang) {
    if (!['en', 'th', 'zh'].includes(lang) || lang === currentLang) return;
    currentLang = lang;
    localStorage.setItem('sanook_yt_2026_lang', lang);
    renderAll(false);
  }

  // Build Bottom Dots
  const dotNav = document.getElementById('dotNav');
  for (let i = 0; i < TOTAL_SLIDES; i++) {
    const dot = document.createElement('button');
    dot.className = 'slide-dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', `Slide ${i + 1}`);
    dot.addEventListener('click', () => goToSlide(i));
    dotNav.appendChild(dot);
  }

  // Event Listeners
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
  });

  document.getElementById('prevBtn').addEventListener('click', () => goToSlide(currentSlide - 1));
  document.getElementById('nextBtn').addEventListener('click', () => goToSlide(currentSlide + 1));

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') goToSlide(currentSlide + 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') goToSlide(currentSlide - 1);
  });

  document.getElementById('expandAllBtn').addEventListener('click', () => {
    const cards = document.querySelectorAll('#slideStage .expand-card');
    const allOpen = Array.from(cards).every(c => c.classList.contains('open'));
    cards.forEach(c => {
      c.classList.toggle('open', !allOpen);
      openAccordions[c.dataset.key] = !allOpen;
    });
    updateExpandAllButtonState();
  });

  document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
    const sb = document.getElementById('sidebar');
    const stage = document.getElementById('mainStage');
    if (window.innerWidth <= 860) {
      sb.classList.toggle('mobile-open');
    } else {
      sb.classList.toggle('collapsed');
      stage.classList.toggle('expanded');
    }
  });

  const notesDrawer = document.getElementById('notesDrawer');
  document.getElementById('toggleNotesBtn').addEventListener('click', () => notesDrawer.classList.toggle('open'));
  document.getElementById('closeNotesBtn').addEventListener('click', () => notesDrawer.classList.remove('open'));

  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });

  // Initial Render
  renderAll(true);
</script>
</body>
