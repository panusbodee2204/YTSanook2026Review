<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sanook.com YouTube — 2026 Executive Year in Review (EN / ไทย / 中文)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg-base: #070B14;
      --bg-surface: #0E1525;
      --bg-elevated: #141E33;
      --bg-hover: #1A2742;
      --border: rgba(148, 163, 184, 0.14);
      --border-strong: rgba(148, 163, 184, 0.28);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --accent-red: #F43F5E;
      --accent-cyan: #38BDF8;
      --accent-emerald: #10B981;
      --accent-amber: #F59E0B;
      --accent-violet: #A855F7;
      --accent-blue: #6366F1;
      --radius-sm: 10px;
      --radius-md: 16px;
      --shadow-card: 0 12px 32px rgba(0, 0, 0, 0.35);
      --font-body: 'Inter', 'Noto Sans Thai', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-head: 'Space Grotesk', 'Noto Sans Thai', 'Noto Sans SC', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .tabular { font-variant-numeric: tabular-nums; }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 12% 10%, rgba(244, 63, 94, 0.08), transparent 36%),
        radial-gradient(circle at 88% 18%, rgba(56, 189, 248, 0.08), transparent 38%),
        radial-gradient(circle at 50% 95%, rgba(168, 85, 247, 0.06), transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 284px;
      flex-shrink: 0;
      background: rgba(11, 17, 30, 0.94);
      backdrop-filter: blur(18px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 40;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sidebar.collapsed { transform: translateX(-100%); }

    .brand-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-red);
      margin-bottom: 6px;
    }

    .brand-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent-red);
      box-shadow: 0 0 12px var(--accent-red);
    }

    .brand-title {
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 11px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.38;
      transition: all 0.16s ease;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.16), rgba(56, 189, 248, 0.08));
      border-color: rgba(244, 63, 94, 0.36);
      color: var(--text-primary);
      font-weight: 600;
    }

    .nav-num {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      width: 24px; height: 24px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(148, 163, 184, 0.1);
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .nav-item.active .nav-num {
      background: var(--accent-red);
      color: #fff;
    }

    .sidebar-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* Main Stage */
    .main-stage {
      flex: 1;
      margin-left: 284px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: margin-left 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .main-stage.expanded { margin-left: 0; }

    /* Topbar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(7, 11, 20, 0.86);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 11px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7.5px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }

    .btn-primary {
      background: linear-gradient(135deg, #F43F5E, #E11D48);
      border-color: transparent;
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.1); background: linear-gradient(135deg, #F43F5E, #E11D48); }

    .btn-cyan {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.32);
      color: var(--accent-cyan);
    }
    .btn-cyan:hover { background: rgba(56, 189, 248, 0.2); }

    /* Language Selector (Top-Right Corner) */
    .lang-switcher {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      margin-left: 4px;
    }

    .lang-btn {
      padding: 5.5px 11px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.16s ease;
      letter-spacing: 0.02em;
    }

    .lang-btn:hover { color: var(--text-primary); }

    .lang-btn.active {
      background: linear-gradient(135deg, #F43F5E, #E11D48);
      color: #fff;
      box-shadow: 0 2px 10px rgba(244, 63, 94, 0.35);
    }

    .slide-counter {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
    }

    .progress-bar-wrap { height: 3px; background: rgba(148, 163, 184, 0.1); width: 100%; }
    .progress-bar-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, var(--accent-red), var(--accent-cyan));
      transition: width 0.3s ease;
    }

    /* Slide Viewport */
    .slides-wrapper {
      flex: 1;
      padding: 28px 34px 92px;
      max-width: 1380px;
      width: 100%;
      margin: 0 auto;
    }

    .slide-animate {
      animation: fadeSlideIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-header { margin-bottom: 22px; }

    .slide-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 189, 248, 0.25);
      margin-bottom: 10px;
    }
    .slide-kicker.red { background: rgba(244, 63, 94, 0.12); color: var(--accent-red); border-color: rgba(244, 63, 94, 0.28); }
    .slide-kicker.violet { background: rgba(168, 85, 247, 0.12); color: var(--accent-violet); border-color: rgba(168, 85, 247, 0.28); }
    .slide-kicker.emerald { background: rgba(16, 185, 129, 0.12); color: var(--accent-emerald); border-color: rgba(16, 185, 129, 0.28); }

    .slide-title {
      font-family: var(--font-head);
      font-size: clamp(23px, 2.8vw, 33px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.24;
      color: var(--text-primary);
    }

    .slide-subtitle {
      font-size: 14.5px;
      color: var(--text-secondary);
      margin-top: 8px;
      max-width: 940px;
      line-height: 1.65;
    }

    /* Grids */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 15px; margin-bottom: 18px; }
    .kpi-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; margin-bottom: 18px; }
    .kpi-grid-5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 13px; margin-bottom: 18px; }
    .two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-bottom: 18px; }
    .two-col-weighted { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; margin-bottom: 18px; }
    .sub-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

    /* Cards */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-card);
    }

    .kpi-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(160deg, rgba(20, 30, 51, 0.92), rgba(14, 21, 37, 0.98));
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 17px 19px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .kpi-card:hover { transform: translateY(-2px); border-color: var(--border-strong); }
    .kpi-card::after {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--accent-cyan); opacity: 0.88;
    }
    .kpi-card.accent-red::after { background: var(--accent-red); }
    .kpi-card.accent-emerald::after { background: var(--accent-emerald); }
    .kpi-card.accent-amber::after { background: var(--accent-amber); }
    .kpi-card.accent-violet::after { background: var(--accent-violet); }

    .kpi-label {
      font-size: 11.5px; font-weight: 600; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 9px;
    }

    .kpi-value {
      font-family: var(--font-head);
      font-size: clamp(21px, 2.2vw, 29px);
      font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); line-height: 1.15;
    }

    .kpi-delta {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 9px;
      font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
      background: rgba(16, 185, 129, 0.14); color: #34D399;
    }
    .kpi-delta.warn { background: rgba(245, 158, 11, 0.14); color: #FBBF24; }
    .kpi-delta.info { background: rgba(56, 189, 248, 0.14); color: #7DD3FC; }
    .kpi-delta.violet { background: rgba(168, 85, 247, 0.16); color: #D8B4FE; }

    .kpi-note { font-size: 12px; color: var(--text-muted); margin-top: 7px; line-height: 1.48; }

    .card-title {
      font-family: var(--font-head);
      font-size: 15.5px; font-weight: 700; color: var(--text-primary);
      margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }

    .card-sub { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 14px; line-height: 1.55; }

    .callout {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.09), rgba(99, 102, 241, 0.07));
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: var(--radius-md);
      padding: 15px 19px; margin-bottom: 18px; font-size: 13.5px; line-height: 1.7; color: var(--text-primary);
    }
    .callout.red { background: linear-gradient(135deg, rgba(244, 63, 94, 0.11), rgba(245, 158, 11, 0.06)); border-color: rgba(244, 63, 94, 0.3); }
    .callout.emerald { background: linear-gradient(135deg, rgba(16, 185, 129, 0.11), rgba(56, 189, 248, 0.06)); border-color: rgba(16, 185, 129, 0.3); }

    .mix-bar { height: 14px; border-radius: 999px; overflow: hidden; display: flex; background: var(--bg-elevated); margin: 12px 0 14px; }
    .mix-seg { height: 100%; }
    .legend-row { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }
    .legend-item { display: inline-flex; align-items: center; gap: 7px; }
    .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }

    .chart-box { position: relative; height: 265px; width: 100%; }
    .chart-box.compact { height: 225px; }

    /* Expandable Deep-Dive Modules */
    .expand-stack { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
    .expand-card {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md);
      overflow: hidden; transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .expand-card.open { border-color: rgba(56, 189, 248, 0.42); box-shadow: 0 14px 36px rgba(0, 0, 0, 0.42); }

    .expand-trigger {
      width: 100%;
      background: linear-gradient(90deg, rgba(20, 30, 51, 0.65), rgba(14, 21, 37, 0.9));
      border: none; padding: 15px 19px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      cursor: pointer; color: var(--text-primary); text-align: left; font-family: inherit;
      transition: background 0.18s ease;
    }
    .expand-trigger:hover { background: rgba(26, 39, 66, 0.85); }

    .expand-trigger-left { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
    .expand-badge {
      font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 4px 9px; border-radius: 6px;
      background: rgba(56, 189, 248, 0.14); color: var(--accent-cyan); border: 1px solid rgba(56, 189, 248, 0.28);
    }
    .expand-badge.red { background: rgba(244, 63, 94, 0.14); color: #FDA4AF; border-color: rgba(244, 63, 94, 0.3); }
    .expand-badge.emerald { background: rgba(16, 185, 129, 0.14); color: #6EE7B7; border-color: rgba(16, 185, 129, 0.3); }
    .expand-badge.violet { background: rgba(168, 85, 247, 0.14); color: #D8B4FE; border-color: rgba(168, 85, 247, 0.3); }
    .expand-badge.amber { background: rgba(245, 158, 11, 0.14); color: #FCD34D; border-color: rgba(245, 158, 11, 0.3); }

    .expand-title { font-family: var(--font-head); font-size: 14.5px; font-weight: 700; color: var(--text-primary); }
    .expand-hint { font-size: 12px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .chevron {
      width: 26px; height: 26px; border-radius: 50%; background: rgba(148, 163, 184, 0.12);
      display: inline-flex; align-items: center; justify-content: center; font-size: 13px; color: var(--text-primary);
      transition: transform 0.25s ease, background 0.2s ease;
    }
    .expand-card.open .chevron { transform: rotate(180deg); background: var(--accent-cyan); color: #070B14; }

    .expand-body {
      display: none; padding: 19px 21px 21px;
      border-top: 1px solid var(--border); background: rgba(9, 14, 25, 0.68);
    }
    .expand-card.open .expand-body { display: block; animation: fadeSlideIn 0.22s ease; }

    /* Tables */
    .table-wrap { width: 100%; overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    thead { background: rgba(20, 30, 51, 0.96); }
    th {
      padding: 10px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--text-secondary); border-bottom: 1px solid var(--border-strong); white-space: nowrap;
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text-primary); vertical-align: top; line-height: 1.55; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(56, 189, 248, 0.04); }
    .row-highlight { background: rgba(244, 63, 94, 0.08) !important; font-weight: 600; }
    .row-total { background: rgba(56, 189, 248, 0.09) !important; font-weight: 700; }

    .pill { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .pill-green { background: rgba(16, 185, 129, 0.16); color: #34D399; }
    .pill-red { background: rgba(244, 63, 94, 0.16); color: #FDA4AF; }
    .pill-amber { background: rgba(245, 158, 11, 0.16); color: #FCD34D; }
    .pill-cyan { background: rgba(56, 189, 248, 0.16); color: #7DD3FC; }
    .pill-violet { background: rgba(168, 85, 247, 0.16); color: #D8B4FE; }

    .detail-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .detail-list li { position: relative; padding-left: 17px; font-size: 13.5px; line-height: 1.65; color: var(--text-secondary); }
    .detail-list li::before {
      content: ""; position: absolute; left: 0; top: 9px; width: 7px; height: 7px;
      border-radius: 50%; background: var(--accent-cyan);
    }
    .detail-list.red li::before { background: var(--accent-red); }
    .detail-list.emerald li::before { background: var(--accent-emerald); }
    .detail-list.amber li::before { background: var(--accent-amber); }
    .detail-list.violet li::before { background: var(--accent-violet); }
    .detail-list strong { color: var(--text-primary); }

    .mini-panel {
      background: rgba(14, 21, 37, 0.9); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 15px;
    }
    .mini-panel h4 { font-family: var(--font-head); font-size: 14px; margin-bottom: 9px; color: var(--text-primary); }
    .section-divider {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-muted); margin: 16px 0 9px;
    }
    .footnote { font-size: 12px; color: var(--text-muted); margin-top: 11px; line-height: 1.6; }

    /* Speaker Notes Drawer */
    .notes-drawer {
      position: fixed; right: 24px; bottom: 24px; width: min(480px, calc(100vw - 32px)); max-height: 64vh;
      background: rgba(14, 21, 37, 0.97); backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.38); border-radius: var(--radius-md);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65); z-index: 60; display: none; flex-direction: column; overflow: hidden;
    }
    .notes-drawer.open { display: flex; }
    .notes-header {
      padding: 13px 17px; background: rgba(20, 30, 51, 0.95); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .notes-header span { font-family: var(--font-head); font-size: 13.5px; font-weight: 700; color: var(--accent-cyan); }
    .notes-body { padding: 16px 18px; overflow-y: auto; font-size: 13.5px; line-height: 1.75; color: var(--text-secondary); white-space: pre-line; }

    /* Bottom Floating Nav */
    .bottom-nav {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 35;
      background: rgba(14, 21, 37, 0.94); backdrop-filter: blur(16px);
      border: 1px solid var(--border-strong); border-radius: 999px; padding: 6px 10px;
      display: flex; align-items: center; gap: 8px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    .dot-nav { display: flex; align-items: center; gap: 6px; padding: 0 6px; }
    .slide-dot { width: 8px; height: 8px; border-radius: 999px; background: rgba(148, 163, 184, 0.3); border: none; cursor: pointer; transition: all 0.2s ease; }
    .slide-dot.active { width: 24px; background: var(--accent-red); }

    @media (max-width: 1120px) {
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  function getSpeakerNote(idx) {
    const notes = [
      // Slide 1
      L(
        `SLIDE 01 — FULL 2026 REVENUE REPORT\n\nSanook.com closed Jan 1 – Nov 24, 2026 with $16,734.53 in finalized YouTube revenue—an 18.2x (+1,716.5%) leap over 2025.\n\nCrucially, this wasn't driven by view volume alone (+323%). Watch Time surged +2,227% to 2.07M hours, unlocking mid-roll inventory and lifting Channel RPM 4.5x from $0.24 to $1.07.\n\nEarnings are evenly cushioned between Watch Page Ads (54.87%) and YouTube Premium (44.93%), with flagship Nintha Khao generating 94.50% ($15,813.72). Expand the 2027 levers panel for five concrete steps to push revenue higher.`,
        `สไลด์ 01 — ภาพรวมรายได้ปี 2026 ฉบับเต็ม\n\nเปิดด้วยตัวเลขรายได้ภาพรวมครับ ช่วงวันที่ 1 ม.ค. – 24 พ.ย. 2026 ช่อง Sanook.com ทำรายได้รวมอยู่ที่ $16,734.53 โตขึ้นจากปีก่อนถึง 18.2 เท่า (+1,716.5%)\n\nจุดที่น่าสนใจมากคือ รายได้ไม่ได้โตเพราะยอดวิวที่เพิ่มขึ้น 4 เท่าเพียงอย่างเดียว แต่หัวใจสำคัญอยู่ที่ Watch Time ที่พุ่งทะลุ 2.07 ล้านชั่วโมง (+2,227%) ทำให้คลิปเปิดโฆษณาคั่นกลางได้มากขึ้น และดัน RPM จาก $0.24 ขึ้นมาแตะ $1.07\n\nโครงสร้างรายได้ก็ถือว่าแข็งแรงและสมดุลมาก เพราะได้จาก YouTube Premium เกือบครึ่งหนึ่ง (44.93%) โดยมีรายการ "นินทาข่าว" เป็นตัวชูโรงทำเงินสูงถึง 94.50% ของทั้งช่องครับ`,
        `第01页 — 2026年全年营收全景复盘\n\n各位好，先看全年的商业变现大盘。2026年1月1日至11月24日，Sanook.com YouTube 频道实现预估营收 16,734.53 美元，较去年同期暴增 18.2 倍（+1,716.5%）。\n\n这背后最关键的驱动力，并不只是播放量增长了 323%，而是总观看时长飙升了 2,227%，突破 207 万小时。更长的单次观看充分释放了中插广告库存，直接把频道 RPM 从去年的 0.24 美元拉升至 1.07 美元。\n\n同时，我们的收入结构非常抗风险：观看页广告占 54.87%，YouTube Premium 会员分成高达 44.93%。其中旗舰栏目《热点辣评》（Nintha Khao）单枪匹马贡献了全频道 94.50% 的收入。`
      ),
      // Slide 2
      L(
        `SLIDE 02 — EXECUTIVE SUMMARY & YOY TURNAROUND\n\nIf there is one takeaway from 2026, it is that pivoting to high-retention, long-form news commentary completely reset Sanook.com's commercial foundation.\n\nIn 2025, viewers stayed an average of just 1m 23s, generating under 89K watch hours and less than $1,000 all year. In 2026, views jumped 323% past 23.1M, watch time surged 23x past 2M hours, and overall AVD climbed to 5:22 (5:42 on long-form).\n\nThis wasn't lucky viral traffic: disciplined packaging lifted CTR +1.51 pts to 5.74% across 176M impressions, adding nearly 44,000 net new subscribers.`,
        `สไลด์ 02 — สรุปผู้บริหารและการพลิกโฉมช่องปี 2026\n\nถ้าจะสรุปปี 2026 ในประโยคเดียว คือปีที่เราเปลี่ยนโมเดลจากคลิปข่าวสั้นมาเป็นรายการวิเคราะห์ข่าวแบบยาว และมันพลิกฐานธุรกิจของช่องไปโดยสิ้นเชิงครับ\n\nย้อนดูปี 2025 คนดูคลิปเราเฉลี่ยแค่ 1 นาที 23 วินาที ทั้งปีได้ Watch Time ไม่ถึง 9 หมื่นชั่วโมง และรายได้ยังไม่ถึงพันเหรียญ พอมาปี 2026 ยอดวิวโตขึ้น 4 เท่าทะลุ 23.1 ล้านวิว ชั่วโมงการรับชมโต 23 เท่าเกิน 2 ล้านชั่วโมง และคนดูอยู่กับเรานานขึ้นเกือบ 4 เท่า\n\nที่สำคัญคือไม่ใช่เรื่องฟลุกครับ เพราะ CTR ของช่องขยับขึ้นถึง 1.51% มาอยู่ที่ 5.74% จากยอดการมองเห็นกว่า 176 ล้านครั้ง และดึงผู้ติดตามใหม่เพิ่มเกือบ 44,000 คน`,
        `第02页 — 核心摘要与年度战略反转\n\n如果用一句话总结 2026 年，那就是：果断转向高留存长视频新闻评论，彻底重塑了 Sanook.com 的基本盘。\n\n对比 2025 年，当时频道单次观看只有 1 分 23 秒，全年时长不到 8.9 万小时，收入不足千美元；而今年播放量增长 323% 突破 2,310 万，观看时长暴涨 23.3 倍突破 206 万小时，全频道平均观看时长提升至 5 分 22 秒（长视频达 5 分 42 秒）。\n\n更重要的是，这并非偶发爆款，而是内容与封面体系化运作的结果：1.76 亿次曝光下 CTR 净增 1.51 个百分点至 5.74%，全年净增订阅近 4.4 万人。`
      ),
      // Slide 3
      L(
        `SLIDE 03 — REVENUE TRAJECTORY & INFLECTION POINT\n\nThis chart maps the financial turnaround of 2026: a clear structural breakout in May followed by steady compounding.\n\nFrom January through April, the channel averaged ~$57/month at $0.12–$0.49 RPM. In May, launching consistent long-form news episodes multiplied monthly watch time 41x—from 2.2K hours in April to 93.4K hours—lifting revenue +1,357% to nearly $1,000.\n\nMomentum never cooled: RPM climbed every quarter from $0.78 in May to $1.39 in October, where revenue hit an all-time high of $4,829.13—70x April's level.`,
        `สไลด์ 03 — เส้นทางรายได้และจุดเปลี่ยนเดือนพฤษภาคม\n\nกราฟนี้เห็นชัดเลยครับว่ารายได้ของเราไม่ได้ค่อยๆ โต แต่เกิดจุดหักเหชัดเจนในเดือนพฤษภาคม แล้วเร่งสปีดต่อแบบทบต้น\n\n4 เดือนแรกของปี รายได้เรายังนิ่งๆ อยู่ที่ประมาณ 50–80 เหรียญต่อเดือน พอเดือนพฤษภาคมที่เราเริ่มรันรายการข่าวแบบยาวอย่างจริงจัง Watch Time เดือนเดียวกระโดดขึ้น 41 เท่า จากสองพันกว่าชั่วโมงเป็นเก้าหมื่นกว่าชั่วโมง รายได้พุ่งขึ้น +1,357% เกือบแตะพันเหรียญทันที\n\nหลังจากนั้นค่า RPM ไต่ขึ้นทุกไตรมาส จนไปทำสถิติสูงสุดในเดือนตุลาคมที่ $1.39 และปิดรายได้เดือนเดียวถึง $4,829 สูงกว่าเดือนเมษายนถึง 70 เท่าครับ`,
        `第03页 — 月度营收走势与五月拐点\n\n这张趋势图非常直观地展现了今年的财务曲线：五月实现结构性破局，随后进入持续复利爬坡。\n\n一季度至四月，频道处于低基数蓄水期，月均收入仅 57 美元左右。五月正式跑通日更长视频模式后，单月观看时长从四月的 2,237 小时猛增 41 倍至 93,410 小时，当月收入环比暴涨 1,357%，一举逼近千美元大关。\n\n此后增长势头一路高歌：RPM 逐季抬升至十月的历史峰值 1.39 美元，十月单月营收创下 4,829.13 美元的新纪录，较四月翻了整整 70 倍。`
      ),
      // Slide 4
      L(
        `SLIDE 04 — CONTENT FORMAT CONTRIBUTION\n\nThe format verdict is crystal clear: Long-form video generates virtually all business value on the channel.\n\nLong-form drove 93.76% of views, 99.51% of watch time (2.06M hours), 99.80% of revenue ($16,701.67), and 96.17% of net subscribers. Every 1,000 long-form views yielded $1.14 versus just $0.03 on Shorts.\n\nThat gives us a clear rule: never evaluate Shorts on direct ad payouts ($32.86 total)—use them strictly as 30-second teasers funneling viewers to full episodes. Meanwhile, Live Streams (<1,000 views) remain an untapped growth pillar for 2027.`,
        `สไลด์ 04 — วิเคราะห์ผลงานรายฟอร์แมต\n\nหน้านี้ตอบโจทย์การจัดสรรทรัพยากรได้ชัดเจนมากครับ นั่นคือ "คลิปยาว (Long-form)" คือตัวทำเงินและสร้างฐานแฟนตัวจริงของช่อง\n\nคลิปยาวกินสัดส่วน 93.76% ของยอดวิว, 99.51% ของเวลาดูทั้งหมด, 99.80% ของรายได้ และดึงผู้ติดตามใหม่ถึง 96.2% ถ้าเทียบความคุ้มค่า ทุก 1,000 วิวของคลิปยาวทำเงิน $1.14 ส่วน Shorts ได้แค่ $0.03 ต่างกันถึง 38 เท่า\n\nดังนั้นบทบาทของ Shorts ในปีหน้าต้องชัดครับ เราไม่หวังเงินจากยอดวิว Shorts โดยตรง แต่จะตัดซีนเด็ด 30 วินาทีมาเป็นตัวล่อคนเข้าดูคลิปเต็ม ส่วน Live Stream ที่ปีนี้แทบยังไม่ได้แตะเลย จะเป็นโอกาสใหม่ที่น่าลองในช่วงข่าวใหญ่ปี 2027 ครับ`,
        `第04页 — 各内容形态价值贡献对比\n\n这组数据非常清晰地明确了我们的资源配置方向：长视频贡献了频道几乎全部的商业与用户价值。\n\n长视频不仅拿下了 93.76% 的播放量，更贡献了 99.51% 的观看时长（206 万小时）、99.80% 的营收以及 96.2% 的净增订阅。按变现效率算，长视频每千次播放产出 1.14 美元，而 Shorts 只有 0.03 美元，相差整整 38 倍。\n\n因此，Shorts 绝不能按直接分成（全年仅 32.86 美元）去考核，它的唯一使命就是作为“30秒高能预告片”给长视频正片导流。此外，今年几乎空白的直播形态，将是 2027 年突围的新增量。`
      ),

      L(
        `SLIDE 05 — CONTENT STRATEGY AUDIT\n\nHere we unpack why flagship episodes cleared half a million views while experimental shows lagged.\n\nNintha Khao thrived as the evening companion to live daytime TV drama (Hone Krasae). Personal betrayal, leaked audio, and high-stakes clashes pushed CTR to 6.6%–7.3% and kept viewers watching 11–15 minutes.\n\nConversely, SEERCRET PODCAST (10,316 views, 3.12% CTR) suffered from audience intent mismatch on Browse feeds, while Nintha Series actually achieved solid click appeal (209K views, 5.59% CTR) but lost earnings on 6 of 13 episodes due to Content ID claims.`,
        `สไลด์ 05 — กลยุทธ์คอนเทนต์: อะไรปัง และอะไรต้องแก้\n\nมาดูเบื้องหลังหน้างานกันครับว่าทำไมบางคลิปทะลุ 5–6 แสนวิว แต่บางรายการยังไม่ติดลมบน\n\nฝั่งที่สำเร็จชัดเจนคือ "นินทาข่าว" ที่จับจังหวะเป็นเพื่อนคุยหลังรายการสดดังอย่างโหนกระแส เมื่อข่าวมีความขัดแย้งสูง มีหลักฐานคลิปเสียงหรือดราม่าครอบครัว คนดูที่อินอยู่แล้วจะกดเข้ามาทันที ดัน CTR แตะ 6.6%–7.3% และฟังยาวถึง 11–15 นาที\n\nส่วนฝั่งรายการใหม่เจอโจทย์คนละแบบครับ SEERCRET PODCAST ติดเรื่องกลุ่มคนดูไม่ตรงกัน (Intent Mismatch) เพราะแฟนช่องเราคุ้นกับการดูข่าวดราม่า ทำให้ CTR อยู่ที่ 3.12% ขณะที่ "นินทาซีรีส์" จริงๆ มีคนกดดูเยอะมาก CTR 5.59% เกือบเท่าค่าเฉลี่ยช่อง แต่เสียดายที่ 6 จาก 13 ตอนโดนเคลมลิขสิทธิ์ภาพละครจนรายได้เป็นศูนย์`,
        `第05页 — 内容策略复盘：爆款逻辑与短板\n\n这一页拆解了为什么头部内容能轻松突破五十万播放，而部分新栏目却增长乏力。\n\n旗舰栏目《热点辣评》跑通了“日间爆款直播+晚间深度复盘”的伴随模式。围绕国民级访谈节目《Hone Krasae》的冲突热点、曝光录音和情感纠葛，观众本身情绪已高度投入，自然带动 CTR 飙升至 6.6%–7.3%，人均停留 11–15 分钟。\n\n而实验栏目面临两类截然不同的瓶颈：SEERCRET PODCAST 属于典型的“受众心智错位”，新闻粉丝对常规玄学访谈兴趣偏低（CTR 仅 3.12%）；《剧集辣评》其实点击吸引力很强（20.9万播放，CTR 5.59%），但 13 期里有 6 期因使用电视剧原片触发版权索赔，白白损失了广告分成。`
      ),
      // Slide 6
      L(
        `SLIDE 06 — AUDIENCE DISCOVERY & TRAFFIC SOURCES\n\nSanook.com enjoys a remarkably healthy feed-driven discovery engine: over 75% of views and 89.6% of watch time came from Browse Features and Suggested Videos combined.\n\nBrowse Features generated 10.7M views across 74.6M impressions at a strong 7.05% CTR, proving our thumbnails win the click on crowded Home screens. Meanwhile, Suggested Videos is our #1 watch-time engine—965K hours (46.7% share) at an 8:39 average view duration.\n\nSearch added 3.6M trending-topic views, while loyalists from Channel Pages and Playlists stayed over 9.5 minutes per visit.`,
        `สไลด์ 06 — ที่มาของยอดวิวและพลังระบบแนะนำของ YouTube\n\nโครงสร้างทราฟฟิกของช่องถือว่าสุขภาพดีมากครับ เพราะกว่า 75% ของยอดวิว และเกือบ 90% ของเวลาดูทั้งหมด มาจากระบบแนะนำของ YouTube โดยตรง ไม่ต้องพึ่งการยิงแอดหรือแชร์จากข้างนอก\n\nหน้าแรก (Browse) เป็นด่านหน้าที่ดึงวิวได้มากที่สุด 10.7 ล้านครั้ง พร้อม CTR สูงถึง 7.05% พิสูจน์ว่าปกและพาดหัวของเราสู้บนหน้าฟีดได้สบาย ส่วนวิดีโอแนะนำ (Suggested) คือตัวสร้าง Watch Time อันดับหนึ่งของช่อง กว่า 9.65 แสนชั่วโมง เพราะคนดูคลิกต่อจากคลิปข่าวอื่นแล้วฟังยาวเฉลี่ยเกือบ 9 นาที\n\nนอกจากนี้ยังมีคนเสิร์ชหาประเด็นร้อนเข้ามาอีก 3.6 ล้านวิว และกลุ่มแฟนประจำที่กดเข้าหน้าช่องหรือเพลย์ลิสต์อยู่ฟังยาวเกือบ 10 นาทีต่อครั้งครับ`,
        `第06页 — 流量结构与平台推荐机制\n\n频道的流量底盘非常健康：超过 75% 的播放量和近 90% 的观看时长，均来自 YouTube 自身的算法推荐（首页信息流 + 相关推荐），完全跑通了自然增长飞轮。\n\n其中，首页推荐是拉新门面，在 7,460 万次曝光下斩获 1,069 万播放，CTR 高达 7.05%，证明封面和标题在激烈的信息流竞争中极具穿透力；相关推荐则是时长第一引擎，贡献了 96.5 万小时（占全频道 46.7%），观众从同类新闻跳转后平均能看 8 分 39 秒。\n\n搜索端也承接了 360 万次热点词条流量，而主动进入频道主页和播放列表的忠实粉丝，单次停留更是超过 9 分半钟。`
      ),
      // Slide 7
      L(
        `SLIDE 07 — AUDIENCE DEMOGRAPHICS & VIEWING HABITS\n\nFor brand sponsors and executives, this is our strongest commercial profile.\n\n62.8% of our audience sits squarely in the prime 25–44 working-adult demographic with active purchasing power, evenly balanced at 52% female and 48% male.\n\nWhile smartphones lead raw views (69%), Tablets (13:30 AVD) and Connected TVs (8:39 AVD) account for nearly a quarter (24.5%) of watch time—proving viewers treat our evening drops like prime-time TV between 6:00 PM and 10:00 PM. Plus, 1.7M+ overseas diaspora views actively boost our international CPMs.`,
        `สไลด์ 07 — เจาะลึกฐานคนดูและพฤติกรรมการรับชม\n\nถ้าจะนำตัวเลขไปขายงานลูกค้าหรือพาร์ตเนอร์ สไลด์นี้คือจุดขายที่แข็งแรงที่สุดของเราครับ\n\nฐานคนดู 62.8% คือกลุ่มวัยทำงานอายุ 25–44 ปี ซึ่งเป็นกลุ่มที่มีกำลังซื้อและตัดสินใจจับจ่ายจริง แถมสัดส่วนผู้หญิงกับผู้ชายแทบจะครึ่งต่อครึ่ง (52% ต่อ 48%) ทำให้รับงานสปอนเซอร์สินค้าแมสได้แทบทุกหมวด\n\nอีกจุดที่น่าสนใจคือพฤติกรรมหน้าจอครับ แม้ 69% จะดูผ่านมือถือ แต่กลุ่มที่ดูผ่านแท็บเล็ต (เฉลี่ย 13 นาทีครึ่ง) และสมาร์ททีวี (เฉลี่ยเกือบ 9 นาที) รวมกันกินเวลาดูถึงเกือบ 1 ใน 4 ของช่อง สะท้อนว่าคนดูเปิดรายการเราช่วง 6 โมงเย็นถึง 4 ทุ่มเหมือนดูข่าวทีวีตอนค่ำ พร้อมฐานคนไทยในอเมริกา ออสเตรเลีย ญี่ปุ่น และยุโรปกว่า 1.7 ล้านวิว ที่ช่วยดึงเรทโฆษณาให้สูงขึ้นด้วยครับ`,
        `第07页 — 受众画像与黄金时段洞察\n\n面向品牌客户和广告主招商时，这一页就是我们最具说服力的王牌。\n\n全频道 62.8% 的受众精准锁定在 25–44 岁高消费力职场主力群体，且男女比例几乎对半（女 52.2% / 男 47.7%），非常适合快消、汽车、金融、电商等大众品牌投放。\n\n在终端习惯上，虽然手机端占 69% 播放量，但平板（人均观看 13 分 30 秒）与智能电视（人均 8 分 39 秒）合计贡献了近四分之一的总时长——这意味着用户在曼谷时间晚 6 点到 10 点，已经把我们的节目当成了“晚间电视”。再加上美、澳、日、欧等超 170 万海外泰裔高单价流量，有效拉升了频道整体变现水平。`
      ),
      // Slide 8
      L(
        `SLIDE 08 — DEEP-DIVE: NINTHA KHAO\n\nNintha Khao powered Sanook.com's entire 2026 turnaround: 148 Monday–Friday episodes generated 20.39M views, 94.70% of watch hours (1.96M hrs), and 94.50% of revenue ($15,813.72).\n\nOur Top 5 most-viewed episodes delivered 2.67M views and $1,812, with marathon sessions hitting 11 to 15+ minutes on stories like Auntie Maew's Son and Yat vs. Ta.\n\nOur core moat is operational routine: an unbroken Mon–Fri schedule paired with conversational storytelling and high-contrast visual packaging.`,
        `สไลด์ 08 — เจาะลึกรายการหลัก "นินทาข่าว"\n\nลงรายละเอียดรายการพระเอกของปีนี้ครับ ตลอด 148 ตอนที่ออกอากาศทุกวันจันทร์ถึงศุกร์ "นินทาข่าว" ทำยอดวิวไป 20.39 ล้านครั้ง ครองชั่วโมงรับชม 94.70% และสร้างรายได้ถึง 94.50% ของทั้งช่อง ($15,813.72)\n\nเฉพาะ 5 ตอนที่คนดูเยอะที่สุดรวมกันก็ทะลุ 2.67 ล้านวิวแล้วครับ ที่น่าประทับใจคือตอนที่มีหลักฐานหรือเรื่องราวเข้มข้นอย่างตอนลูกชายป้าแมว หรือตอนยัต vs ต้า คนดูอยู่ฟังยาวเฉลี่ยถึง 11–15 นาทีเลยทีเดียว\n\nข้อได้เปรียบที่สร้างยากมากคือ "ความสม่ำเสมอวันจันทร์ถึงศุกร์" ครับ มันทำให้เกิดนิสัยคนดูที่รอฟังสรุปข่าวหลังเลิกงาน ผสานกับการเล่าแบบเพื่อนคุยที่เป็นธรรมชาติ ไม่แข็งทื่อเหมือนอ่านข่าวทางการ`,
        `第08页 — 旗舰栏目深度复盘：《热点辣评》\n\n接下来聚焦今年的核心功臣——旗舰栏目《热点辣评》（Nintha Khao）。全年 148 期工作日日更，一举拿下 2,039 万播放、196 万观看小时（占 94.70%）以及 15,813.72 美元收入（占 94.50%）。\n\n仅播放量前五的单期就贡献了 267 万次观看，其中涉及重磅录音、网红决裂的爆款单期，平均观看时长高达 11 至 15 分钟以上，粘性极为惊人。\n\n这套模式最难被复制的护城河，在于雷打不动的“周一至周五日更机制”——成功培养了观众下班后听我们复盘当日热点的强心智，再叠加松弛聊天的叙事语感和高辨识度封面，形成了稳定复利。`
      ),
      // Slide 9
      L(
        `SLIDE 09 — NEW PROGRAM INCUBATOR: SEERCRET & NINTHA SERIES\n\nSEERCRET PODCAST proved strong studio quality and Shorts traction (10K–15K views) with 100% clean copyright, but long-form views stopped at 10,316 (3.12% CTR) due to intent mismatch.\n\nNintha Series proved genuine click appeal—209K views and 5.59% CTR—but Content ID claims demonetized 6 of 13 episodes, capping earnings at $46.21.\n\nIn 2027, we re-anchor both: pivot SEERCRET toward spiritual fraud investigations, and shift Nintha Series to copyright-safe, standalone cultural phenomenon debriefs.`,
        `สไลด์ 09 — ประเมินรายการใหม่: SEERCRET PODCAST & นินทาซีรีส์\n\nส่วนนี้เป็นการรีวิวตรงไปตรงมาสำหรับสองรายการใหม่ที่เราเพิ่งปั้นช่วงปลายปี เพื่อนำบทเรียนไปปรับใช้ปีหน้าครับ\n\nตัวแรก SEERCRET PODCAST งานโปรดักชันสวยมาก ลิขสิทธิ์คลีน 100% และคลิปสั้นทริคดูลายมือทำวิวได้หลักหมื่น แต่พอลงคลิปเต็มในช่องหลัก ยอดวิวรวม 3 ตอนอยู่ที่ 10,316 และ CTR 3.12% เพราะยังไม่เชื่อมกับจริตคนดูข่าวดราม่า\n\nตัวที่สอง "นินทาซีรีส์" จริงๆ ถือว่ามีแววมากครับ 13 ตอนกวาดไป 2 แสนกว่าวิว และ CTR 5.59% แต่ติดปัญหาใหญ่คือ 6 ตอนโดน Content ID จากภาพละครตัดรายได้หมด ปี 2027 เราจะไม่ทิ้งสองหมวดนี้ แต่จะปรับทิศทางใหม่ครับ โดยปรับ SEERCRET ไปสายเจาะลึกแฉกลโกง/ดราม่าความเชื่อ และปรับนินทาซีรีส์ให้ใช้ภาพนิ่งปลอดลิขสิทธิ์ พร้อมเล่าเป็นประเด็นไวรัลที่ใครก็ดูรู้เรื่องโดยไม่ต้องไล่ดู EP.1`,
        `第09页 — 新IP孵化评估：SEERCRET 与《剧集辣评》\n\n这一页客观复盘我们年末试水的两档新栏目，为明年调优提供依据。\n\n首先是 SEERCRET PODCAST：演播室质感很棒、100%无版权风险，手相民俗类 Shorts 也能跑出 1万–1.5万 播放；但长视频 3 期总播放停留在 10,316 次（CTR 3.12%），症结在于常规玄学访谈与主频道新闻用户的预期存在断层。\n\n其次是《剧集辣评》：13 期累计 20.9 万播放、CTR 高达 5.59%，说明选题和主播化学反应都很能打；可惜 6 期因使用剧集片段被版权方拦截收益，总营收被压在 46.21 美元。2027 年我们的思路不是砍掉，而是“破题重构”：SEERCRET 切入“玄学打假与社会争议调查”，《剧集辣评》全面改为免版权画中画解说，取消分集门槛，聚焦大众热议的文化现象。`
      ),
      // Slide 10
      L(
        `SLIDE 10 — 2027 STRATEGIC PRIORITIES & CONCLUSION\n\n2026 proved the concept; 2027 is about scaling and protecting the brand.\n\n1) Fortify Nintha Khao's Mon–Fri cadence and pilot live breaking-news specials. 2) Refactor spin-offs around investigative controversy and copyright-safe cultural hooks while using Shorts strictly as conversion trailers. 3) Expand commercial tiers via native sponsorships, manual mid-roll optimization, Shopping, and Memberships.\n\nTogether, these pillars target 32–35M views, 2.8–3.2M watch hours, $1.35–$1.50 RPM, and $35,000–$45,000 in annualized platform revenue in 2027.`,
        `สไลด์ 10 — ทิศทางปี 2027 และบทสรุปผู้บริหาร\n\nสรุปภาพรวมปิดท้ายครับ ปี 2026 เราพิสูจน์สูตรสำเร็จได้ชัดเจนแล้ว ปี 2027 จะเป็นปีแห่งการขยายสเกลและกระจายแหล่งรายได้ให้มั่นคงขึ้น ผ่าน 3 แนวทางหลัก\n\nหนึ่ง รักษามาตรฐาน "นินทาข่าว" จันทร์–ศุกร์ให้แน่น พร้อมเริ่มทดลอง Live พิเศษช่วงข่าวใหญ่ สอง ปรับโฉมรายการรองให้เชื่อมโยงกับกระแสดราม่าและปลอดลิขสิทธิ์ 100% โดยใช้ Shorts เป็นตัวส่งคนเข้าคลิปเต็ม และสาม ขยายรายได้เชิงพาณิชย์ ทั้งการวางโฆษณา Mid-roll แบบละเอียด เปิด YouTube Shopping/Memberships และลุยขายแพ็กเกจสปอนเซอร์ตรงกับแบรนด์\n\nหากเดินตามแผนนี้ เป้าหมายปี 2027 ของเราคือ 32–35 ล้านวิว, 2.8–3.2 ล้านชั่วโมงรับชม, RPM $1.35–$1.50 และรายได้จากแพลตฟอร์มแตะ $35,000–$45,000 โดยยังไม่รวมดีลสปอนเซอร์ครับ`,
        `第10页 — 2027 战略规划与高管总结\n\n最后汇报 2027 年的整体作战路线图。2026 年我们已经验证了商业模式，2027 年的核心关键词是“规模化放大”与“多元化变现”，具体落地三大抓手：\n\n第一，守牢基本盘：稳固《热点辣评》周一至周五日更节奏，并在重大突发节点试点实时直播；第二，重构衍生矩阵：推动新栏目全面向“争议调查”与“免版权大众文化热点”转型，Shorts 专职承担正片预告导流；第三，商业化升维：通过精细化手动中插广告推高 RPM，同步开启 YouTube Shopping、频道会员，并重点发力品牌原生赞助。\n\n围绕这三大支柱，我们设定了 2027 年核心目标：冲刺 3,200万–3,500万 播放、280万–320万 观看小时、1.35–1.50 美元 RPM，力争实现 3.5万–4.5万美元的平台基础营收，并开拓可观的品牌直客增量。谢谢各位！`
      )
    ];
    return notes[idx];
  }

  function expandCard(slideIdx, cardKey, badgeClass, badgeText, titleText, hintText, bodyHtml) {
    const stateKey = `${slideIdx}_${cardKey}`;
    const isOpen = !!openAccordions[stateKey];
    return `
      <div class="expand-card ${isOpen ? 'open' : ''}" data-key="${stateKey}">
        <button class="expand-trigger" type="button">
          <div class="expand-trigger-left">
            <span class="expand-badge ${badgeClass}">${badgeText}</span>
            <span class="expand-title">${titleText}</span>
          </div>
          <span class="expand-hint">${hintText} <span class="chevron">▾</span></span>
        </button>
        <div class="expand-body">${bodyHtml}</div>
      </div>
    `;
  }

  function renderSlideContent(idx) {
    switch (idx) {
      /* ==================== SLIDE 1 ==================== */

        type: 'bar',
        data: {
          labels: [
            L('Browse Features','หน้าแรก (Browse)','首页推荐'),
            L('Suggested Videos','วิดีโอแนะนำ','相关推荐'),
            L('YouTube Search','การค้นหา','YouTube 搜索'),
            L('Shorts Feed','ฟีด Shorts','Shorts 信息流'),
            L('Channel & Playlists','หน้าช่อง/เพลย์ลิสต์','主页/播放列表'),
            L('Other / External','อื่นๆ/ภายนอก','其他/外部')
          ],
          datasets: [
            { label: L('Views Share (%)','สัดส่วนยอดวิว (%)','播放占比 (%)'), data: [46.30, 29.47, 15.60, 2.43, 1.80, 4.40], backgroundColor: '#38BDF8', borderRadius: 6 },
            { label: L('Watch Time Share (%)','สัดส่วนเวลาดู (%)','时长占比 (%)'), data: [42.89, 46.70, 3.76, 0.13, 2.90, 3.62], backgroundColor: '#F43F5E', borderRadius: 6 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8 } }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y}%` } } },
          scales: { y: { ticks: { callback: v => v + '%' }, grid: { color: 'rgba(148,163,184,0.08)' } }, x: { grid: { display: false } } }
        }
      });
    }

    if (slideIdx === 6) {
      const ctxAge = document.getElementById('chartSlide7Age');
      const ctxDev = document.getElementById('chartSlide7Device');
      if (!ctxAge || !ctxDev) return;
      chartInstances.s7Age = new Chart(ctxAge, {
        type: 'bar',
        data: {
          labels: ['13–17','18–24','25–34','35–44','45–54','55–64','65+'],
          datasets: [
            { label: L('Female %','หญิง %','女性 %'), data: [0.29, 3.65, 18.72, 13.02, 8.36, 4.98, 3.15], backgroundColor: '#F43F5E', borderRadius: 4 },
            { label: L('Male %','ชาย %','男性 %'), data: [0.20, 2.86, 17.82, 13.27, 7.71, 3.56, 2.25], backgroundColor: '#38BDF8', borderRadius: 4 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8 } }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y}%` } } },
          scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: { callback: v => v + '%' }, grid: { color: 'rgba(148,163,184,0.08)' } } }
        }
      });
      chartInstances.s7Dev = new Chart(ctxDev, {
        type: 'bar',
        data: {
          labels: [L('Mobile','มือถือ','手机'), L('Desktop','คอมพิวเตอร์','电脑'), L('Smart TV','สมาร์ททีวี','智能电视'), L('Tablet','แท็บเล็ต','平板')],
          datasets: [
            { label: L('Views Share (%)','สัดส่วนยอดวิว (%)','播放占比 (%)'), data: [68.98, 12.55, 10.31, 8.03], backgroundColor: '#6366F1', borderRadius: 6 },
            { label: L('Watch Time Share (%)','สัดส่วนเวลาดู (%)','时长占比 (%)'), data: [65.13, 10.14, 11.06, 13.47], backgroundColor: '#10B981', borderRadius: 6 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8 } }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${c.parsed.y}%` } } },
          scales: { y: { ticks: { callback: v => v + '%' }, grid: { color: 'rgba(148,163,184,0.08)' } }, x: { grid: { display: false } } }
        }
      });
    }
  }

  function renderAll(animate = true) {
    document.documentElement.lang = currentLang;

    document.getElementById('brandTitle').textContent = UI.brandTitle();
    document.getElementById('brandSub').textContent = UI.brandSub();
    document.getElementById('sidebarFooter').innerHTML = UI.footer();
    document.getElementById('toggleSidebarBtn').textContent = UI.slidesBtn();
    document.getElementById('toggleNotesBtn').textContent = UI.notesBtn();
    document.getElementById('fullscreenBtn').textContent = UI.fullscreenBtn();
    document.getElementById('prevBtn').textContent = UI.prevBtn();
    document.getElementById('nextBtn').textContent = UI.nextBtn();
    document.getElementById('closeNotesBtn').textContent = UI.closeBtn();

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === currentLang);
    });

    const navList = document.getElementById('navList');
    const items = UI.navItems();
    navList.innerHTML = items.map((label, i) => `
      <button class="nav-item ${i === currentSlide ? 'active' : ''}" data-slide="${i}">
        <span class="nav-num">${String(i + 1).padStart(2, '0')}</span>
        <span>${label}</span>
      </button>
    `).join('');
    navList.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => goToSlide(Number(btn.dataset.slide)));
    });

    const numStr = String(currentSlide + 1).padStart(2, '0');
    document.getElementById('slideCounter').textContent = `${numStr} / ${TOTAL_SLIDES}`;
    document.getElementById('progressBar').style.width = `${((currentSlide + 1) / TOTAL_SLIDES) * 100}%`;

    document.querySelectorAll('.slide-dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));

    const stage = document.getElementById('slideStage');
    stage.innerHTML = `<section class="${animate ? 'slide-animate' : ''}">${renderSlideContent(currentSlide)}</section>`;

    stage.querySelectorAll('.expand-trigger').forEach(trigger => {
      trigger.addEventListener('click', () => {
        const card = trigger.closest('.expand-card');
        const key = card.dataset.key;
        const willOpen = !card.classList.contains('open');
        card.classList.toggle('open', willOpen);
        openAccordions[key] = willOpen;
        updateExpandAllButtonState();
      });
    });

    updateExpandAllButtonState();

    document.getElementById('notesTitle').textContent = `${L('🎙 Speaker Notes — Slide','🎙 สคริปต์นำเสนอ — สไลด์','🎙 演讲备注 — 第')} ${numStr}${currentLang === 'zh' ? '页' : ''}`;
    document.getElementById('notesBody').textContent = getSpeakerNote(currentSlide);

    requestAnimationFrame(() => initSlideCharts(currentSlide));
  }

  function updateExpandAllButtonState() {
    const cards = document.querySelectorAll('#slideStage .expand-card');
    const allOpen = cards.length > 0 && Array.from(cards).every(c => c.classList.contains('open'));
    document.getElementById('expandAllBtn').textContent = allOpen ? UI.collapseAll() : UI.expandAll();
  }

  function goToSlide(index) {
    if (index < 0 || index >= TOTAL_SLIDES) return;
    currentSlide = index;
    document.getElementById('sidebar').classList.remove('mobile-open');
    renderAll(true);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function setLanguage(lang) {
    if (!['en', 'th', 'zh'].includes(lang) || lang === currentLang) return;
    currentLang = lang;
    localStorage.setItem('sanook_yt_2026_lang', lang);
    renderAll(false);
  }

  const dotNav = document.getElementById('dotNav');
  for (let i = 0; i < TOTAL_SLIDES; i++) {
    const dot = document.createElement('button');
    dot.className = 'slide-dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', `Slide ${i + 1}`);
    dot.addEventListener('click', () => goToSlide(i));
    dotNav.appendChild(dot);
  }

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
  });

  document.getElementById('prevBtn').addEventListener('click', () => goToSlide(currentSlide - 1));
  document.getElementById('nextBtn').addEventListener('click', () => goToSlide(currentSlide + 1));

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') goToSlide(currentSlide + 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') goToSlide(currentSlide - 1);
  });

  document.getElementById('expandAllBtn').addEventListener('click', () => {
    const cards = document.querySelectorAll('#slideStage .expand-card');
    const allOpen = Array.from(cards).every(c => c.classList.contains('open'));
    cards.forEach(c => {
      c.classList.toggle('open', !allOpen);
      openAccordions[c.dataset.key] = !allOpen;
    });
    updateExpandAllButtonState();
  });

  document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
    const sb = document.getElementById('sidebar');
    const stage = document.getElementById('mainStage');
    if (window.innerWidth <= 860) {
      sb.classList.toggle('mobile-open');
    } else {
      sb.classList.toggle('collapsed');
      stage.classList.toggle('expanded');
    }
  });

  const notesDrawer = document.getElementById('notesDrawer');
  document.getElementById('toggleNotesBtn').addEventListener('click', () => notesDrawer.classList.toggle('open'));
  document.getElementById('closeNotesBtn').addEventListener('click', () => notesDrawer.classList.remove('open'));

  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });

  renderAll(true);
</script>
</body>
</html>
